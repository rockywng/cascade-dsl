name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLINK_VERSION: "2.3.0"

jobs:
  unit:
    name: compiler (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml
      - name: Pure-Python tests (Flink-backed tests skip without FLINK_HOME)
        run: PYTHONPATH=.:tests python -m unittest discover -s tests -v
      - name: Examples validate cleanly
        run: |
          for e in examples/*/; do python -m cascade_dsl validate "$e"; done

  flink:
    name: against Flink
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Flink distribution
        id: flink-cache
        uses: actions/cache@v4
        with:
          path: ~/flink-${{ env.FLINK_VERSION }}
          key: flink-${{ env.FLINK_VERSION }}
      - name: Download Flink
        if: steps.flink-cache.outputs.cache-hit != 'true'
        run: |
          f="flink-${FLINK_VERSION}/flink-${FLINK_VERSION}-bin-scala_2.12.tgz"
          for url in "https://dlcdn.apache.org/flink/$f" "https://archive.apache.org/dist/flink/$f"; do
            curl -fsSL --retry 5 --retry-all-errors -o /tmp/flink.tgz "$url" && break
          done
          tar xzf /tmp/flink.tgz -C ~
      - name: Python dependencies (PyFlink for Python UDF tests)
        run: pip install pyyaml "apache-flink==${FLINK_VERSION}"
      - name: Build JVM runtime and tools, and the example UDF jar
        run: |
          FLINK_HOME=~/flink-${FLINK_VERSION} runtime/build.sh
          FLINK_HOME=~/flink-${FLINK_VERSION} examples/udfs/udfs/build.sh
      - name: All tests, including real Flink jobs
        run: |
          export FLINK_HOME=~/flink-${FLINK_VERSION}
          PYTHONPATH=.:tests python -m unittest discover -s tests -v
      - name: Example test suites
        run: |
          export FLINK_HOME=~/flink-${FLINK_VERSION}
          for e in examples/*/; do python -m cascade_dsl test "$e"; done
