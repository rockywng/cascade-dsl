name: connectors

# Every catalog connector beyond Kafka / Postgres CDC / JDBC against a real system or its official
# emulator: MySQL, SQL Server and MongoDB CDC (snapshot, live changes, batch snapshot), Elasticsearch,
# DynamoDB, Kinesis (sink and source), Hudi (sink and source), Delta. See integration/connectors.py.
on:
  push:
    branches: [main, "connectors-*"]
  workflow_dispatch:
    inputs:
      only:
        description: comma-separated cases (default all)
        default: ""

concurrency:
  group: connectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install pyyaml
      - name: Connectors end to end
        run: python integration/connectors.py ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
