name: integration

# Real Kafka, Postgres (CDC + JDBC) and Flink 2.3: first as a docker-compose session cluster,
# then through the Flink Kubernetes Operator on kind. Slow (image build, cluster start-up), so it
# runs on main and on demand rather than on every pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install pyyaml
      - name: Build image, run v1, upgrade to v2 from a savepoint
        run: python integration/run.py

  kubernetes:
    name: kind + Flink Kubernetes Operator
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install pyyaml
      - name: Install kind, kubectl, helm
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin && cd "$(mktemp -d)"
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum \
            | awk '{print $1"  kind"}' | sha256sum -c
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
          echo "$(curl -fsSL https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl.sha256)  kubectl" | sha256sum -c
          curl -fsSLo helm.tgz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "$(curl -fsSL https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum | awk '{print $1}')  helm.tgz" \
            | sha256sum -c
          tar xzf helm.tgz linux-amd64/helm
          install -m 755 kind kubectl linux-amd64/helm ~/.local/bin/
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Deploy with cascade deploy, upgrade through the operator
        run: python integration/k8s.py
