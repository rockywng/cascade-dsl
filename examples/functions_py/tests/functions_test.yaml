tests:
  - name: weighted_average_by_helpful_votes
    target: product_rating
    given:
      reviews:
        - {product_id: p1, rating: 5.0, helpful_votes: 3.0, ts: "2026-01-01 10:00:00"}
        - {product_id: p1, rating: 1.0, helpful_votes: 1.0, ts: "2026-01-01 10:00:01"}
        - {product_id: p2, rating: 4.0, helpful_votes: 0.0, ts: "2026-01-01 10:00:02"}
    expect:
      rows:
        - {product_id: p1, rating: 4.0}
        - {product_id: p2, rating: null}

  - name: one_row_per_tag
    target: review_tags
    given:
      reviews:
        - {product_id: p1, rating: 5.0, helpful_votes: 1.0, tags: "fast, cheap", ts: "2026-01-01 10:00:00"}
        - {product_id: p2, rating: 3.0, helpful_votes: 1.0, ts: "2026-01-01 10:00:01"}
    expect:
      rows:
        - {product_id: p1, tag: fast, pos: 0}
        - {product_id: p1, tag: cheap, pos: 1}

  - name: an_edited_review_is_retracted
    target: rating_of_latest
    given:
      reviews:
        - {review_id: r1, product_id: p1, rating: 1.0, helpful_votes: 1.0, ts: "2026-01-01 10:00:00"}
        - {review_id: r2, product_id: p1, rating: 5.0, helpful_votes: 1.0, ts: "2026-01-01 10:00:01"}
        - {review_id: r1, product_id: p1, rating: 4.0, helpful_votes: 3.0, ts: "2026-01-01 10:00:02"}
    expect:
      rows:
        - {product_id: p1, rating: 4.25}
