# Systems for integration/connectors.py: one per catalog connector that isn't covered by the main
# integration stack. Own project name and ports, so it runs beside docker-compose.yml.
name: cascade-conn
services:
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: pw, MYSQL_DATABASE: app}
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--gtid-mode=ON",
              "--enforce-gtid-consistency=ON"]
    ports: ["13306:3306"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-ppw"], interval: 3s, retries: 60}
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: {ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Cascade-pw1", MSSQL_AGENT_ENABLED: "true"}
    ports: ["11433:1433"]
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27018:27017"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    environment: {discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m"}
    ports: ["19200:9200"]
  dynamodb:
    image: amazon/dynamodb-local:latest
    ports: ["18000:8000"]
  kinesis:
    image: ghcr.io/etspaceman/kinesis-mock:0.4.13
    environment: {KINESIS_MOCK_PLAIN_PORT: "4568", INITIALIZE_STREAMS: "orders:1,out:1", LOG_LEVEL: WARN}
    ports: ["14568:4568"]
  pg-exporter:   # the postgres_exporter the generated replication-slot alerts expect
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    environment: {DATA_SOURCE_NAME: "postgresql://postgres:pw@postgres:5432/app?sslmode=disable"}
    command: ["--collector.replication_slot"]
    ports: ["19187:9187"]
    depends_on: [postgres]
  oracle:   # Oracle XE 21c (gvenzl, the image Oracle's own docs point to); LogMiner set up by oracle/setup.sh
    image: gvenzl/oracle-xe:21-slim
    environment: {ORACLE_PASSWORD: syspw}
    volumes: ["./oracle:/cascade-oracle:ro"]
    ports: ["11521:1521"]
  pgprimary:   # failover pair: primary ...
    image: postgres:17
    environment: {POSTGRES_PASSWORD: pw, POSTGRES_DB: app}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10",
              "-c", "synchronized_standby_slots=standby_slot"]
    volumes: ["./failover/primary-init.sh:/docker-entrypoint-initdb.d/init.sh:ro"]
    ports: ["25432:5432"]
  pgstandby:   # ... and its streaming standby, which syncs failover slots
    image: postgres:17
    user: postgres
    environment: {PGDATA: /var/lib/postgresql/data/pgdata}
    entrypoint: ["/failover/standby.sh"]
    volumes: ["./failover:/failover:ro"]
    ports: ["25433:5432"]
    depends_on: [pgprimary]
  kafka-tls:   # a broker that only speaks TLS and requires client certificates (certs from connectors.py)
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SSL://:19093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: SSL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SSL:SSL,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      # the image's configure script takes store files and password files from /etc/kafka/secrets
      KAFKA_SSL_KEYSTORE_FILENAME: broker.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: store_creds
      KAFKA_SSL_KEY_CREDENTIALS: store_creds
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.p12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: store_creds
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes: ["./.work/connectors/tls:/etc/kafka/secrets"]
    ports: ["19093:19093"]   # the advertised address works inside the container too
  postgres:   # where sources' results land, to be compared; also a CDC source (database app)
    image: postgres:17
    environment: {POSTGRES_PASSWORD: pw, POSTGRES_DB: results}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports: ["15432:5432"]
