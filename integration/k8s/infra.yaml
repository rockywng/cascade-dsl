# Kafka and Postgres for the kind run, under the same names as in docker-compose.yml
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka}
spec:
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.3.2
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "1"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms256m"}
          ports: [{containerPort: 9092}]
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: kafka}
spec:
  selector: {app: kafka}
  ports: [{name: kafka, port: 9092}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: postgres-init}
data:
  init.sql: ""   # filled from ../init.sql by k8s.py
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          args: ["-c", "wal_level=logical", "-c", "max_replication_slots=8", "-c", "max_wal_senders=8"]
          env:
            - {name: POSTGRES_USER, value: flink}
            - {name: POSTGRES_PASSWORD, value: flinkpw}
            - {name: POSTGRES_DB, value: shop}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: init, mountPath: /docker-entrypoint-initdb.d}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "flink", "-d", "shop"]}
            periodSeconds: 3
      volumes: [{name: init, configMap: {name: postgres-init}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432}]
